name: 🤖 Evaluate Submission (PR)

on:
  pull_request:
    paths:
      - 'submissions/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  evaluate-pr:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq swig cmake ffmpeg xvfb

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r tournament/requirements.txt

      - name: 🔍 Detect modified submission
        id: detect
        run: |
          # Compare PR against base branch to find modified directories under submissions/
          CHANGED_DIRS=$(git diff --name-only origin/${{ github.base_ref }} HEAD -- 'submissions/**' | \
            grep -E '^submissions/practical[12]/[^/]+/' | \
            cut -d'/' -f1-3 | sort -u || true)

          echo "Found modified submission dirs:"
          echo "$CHANGED_DIRS"

          # Export as output
          FIRST_DIR=$(echo "$CHANGED_DIRS" | head -n 1)
          echo "submission_dir=$FIRST_DIR" >> $GITHUB_OUTPUT

      - name: 🚀 Run Evaluation
        id: eval
        if: steps.detect.outputs.submission_dir != ''
        run: |
          SUB_DIR="${{ steps.detect.outputs.submission_dir }}"
          echo "Evaluating: $SUB_DIR"

          # Determine practical number (1 or 2)
          if [[ "$SUB_DIR" == *"practical1"* ]]; then
            PRACTICAL_ID=1
          elif [[ "$SUB_DIR" == *"practical2"* ]]; then
            PRACTICAL_ID=2
          else
            echo "Cannot determine practical ID from $SUB_DIR"
            exit 1
          fi

          python tournament/evaluate.py \
            --practical "$PRACTICAL_ID" \
            --submission "$SUB_DIR" \
            --episodes 30 \
            --output-json "pr_eval_result.json" \
            --output-pr-comment "pr_comment.md"

      - name: 💬 Post Score to Pull Request
        if: always() && steps.detect.outputs.submission_dir != '' && hashFiles('pr_comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commentBody = fs.readFileSync('pr_comment.md', 'utf8');

            // Find existing bot comment if any
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('RL Tournament Evaluation Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing PR evaluation comment.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new PR evaluation comment.');
            }
