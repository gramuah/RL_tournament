name: Tournament and Pages

on:
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'tournament/**'
      - 'web/**'
      - '.github/workflows/tournament.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: tournament-pages
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install trusted controller dependencies and agent image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swig
          python -m pip install --require-hashes -r tournament/requirements-ci.lock
          docker build -f tournament/Dockerfile.agent -t rl-tournament-agent:local tournament
      - name: Evaluate all agents in isolated containers
        run: |
          python tournament/update_leaderboard.py --episodes 30 --seed 42 --isolated
          python -m tournament.result_artifacts site --data-dir web/data --sha "$GITHUB_SHA"
      - name: Upload JSON results only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tournament-results
          path: |
            web/data/leaderboard_p1.json
            web/data/leaderboard_p2.json
            web/data/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Markdown snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: leaderboard-markdown
          path: LEADERBOARD.md
          retention-days: 14

  build:
    needs: evaluate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fresh trusted site checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download JSON from this run only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tournament-results
          path: ${{ runner.temp }}/results
      - name: Validate provenance and copy bounded results
        run: |
          python3 -m tournament.result_artifacts site --data-dir "$RUNNER_TEMP/results" --sha "$GITHUB_SHA"
          cp "$RUNNER_TEMP/results/leaderboard_p1.json" "$RUNNER_TEMP/results/leaderboard_p2.json" "$RUNNER_TEMP/results/manifest.json" web/data/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
