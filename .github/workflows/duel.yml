name: Agent duel replay

on:
  workflow_dispatch:
    inputs:
      lab:
        description: Lab
        type: choice
        options: ['2', '1']
        default: '2'
      agent_a:
        description: Existing participant directory name
        required: true
        default: rafael_flor
      agent_b:
        description: Existing opponent directory name
        required: true
        default: baseline_random
      episodes:
        description: Episodes (1-10)
        default: '3'
      seed:
        description: Base seed (0-1000000)
        default: '42'

permissions:
  contents: read

jobs:
  duel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LAB_ID: ${{ inputs.lab }}
      AGENT_A: ${{ inputs.agent_a }}
      AGENT_B: ${{ inputs.agent_b }}
      EPISODES: ${{ inputs.episodes }}
      BASE_SEED: ${{ inputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs before invoking tools
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          assert os.environ['LAB_ID'] in ('1', '2')
          assert 1 <= int(os.environ['EPISODES']) <= 10
          assert 0 <= int(os.environ['BASE_SEED']) <= 1000000
          for key in ('AGENT_A', 'AGENT_B'):
              name = os.environ[key]
              assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9_-]{0,63}', name)
              folder = Path('submissions') / ('lab' + os.environ['LAB_ID']) / name
              assert folder.is_dir() and not folder.is_symlink()
              assert (folder / 'agent.py').is_file()
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install trusted host and sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swig ffmpeg
          python -m pip install --require-hashes -r tournament/requirements-ci.lock
          docker build -f tournament/Dockerfile.agent -t rl-tournament-agent:local tournament
      - name: Generate isolated agent duel
        run: |
          mkdir -p "$RUNNER_TEMP/duel"
          python tournament/compare.py --lab "$LAB_ID" --agent-a "submissions/lab$LAB_ID/$AGENT_A" --agent-b "submissions/lab$LAB_ID/$AGENT_B" --episodes "$EPISODES" --seed "$BASE_SEED" --isolated --video "$RUNNER_TEMP/duel/replay.mp4"
      - name: Upload replay for download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duel-replay
          path: ${{ runner.temp }}/duel/
          if-no-files-found: error
          retention-days: 14
