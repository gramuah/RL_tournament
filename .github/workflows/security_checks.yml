name: Security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security and site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Student submissions are evaluated separately by the trusted admission
      # workflow. Never install/build/test their proposed infrastructure here.
      - name: Checkout immutable base for student PR checks
        if: github.event_name == 'pull_request' && !contains(fromJSON('["CarlosGual", "rflor01", "rlopezsastre"]'), github.event.pull_request.user.login)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Checkout trusted push or instructor proposal
        if: github.event_name != 'pull_request' || contains(fromJSON('["CarlosGual", "rflor01", "rlopezsastre"]'), github.event.pull_request.user.login)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install locked host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends swig
          python -m pip install --require-hashes -r tournament/requirements-ci.lock
      - name: Build isolated agent image
        run: docker build -f tournament/Dockerfile.agent -t rl-tournament-agent:local tournament
      - name: Test policies, artifact boundaries, site, and actual Docker isolation
        env:
          RUN_SANDBOX_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Smoke-test both real environments through the isolated evaluator
        run: |
          python tournament/evaluate.py --lab 1 --submission submissions/lab1/baseline_random --episodes 1 --isolated
          python tournament/evaluate.py --lab 2 --submission submissions/lab2/baseline_random --episodes 1 --isolated
      - name: Set up Node for browser checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked browser tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test GitHub Pages subpath and responsive UI
        run: npm run test:web
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-screenshots
          path: artifacts/web/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate and validate full isolated tournament preview
        id: preview
        # Student PRs use the separate single-agent evaluation workflow. A full
        # preview verifies trusted instructor infrastructure changes and main.
        if: github.event_name != 'pull_request' || contains(fromJSON('["CarlosGual", "rflor01", "rlopezsastre"]'), github.event.pull_request.user.login)
        run: |
          mkdir "$RUNNER_TEMP/tournament-preview"
          cp -R tournament submissions "$RUNNER_TEMP/tournament-preview/"
          cd "$RUNNER_TEMP/tournament-preview"
          python tournament/update_leaderboard.py --episodes 30 --seed 42 --isolated
          python -m tournament.result_artifacts site --data-dir web/data --sha "$GITHUB_SHA"
          python - <<'PYCODE'
          import json
          from pathlib import Path
          for lab in (1, 2):
              results = json.loads(Path(f'web/data/leaderboard_p{lab}.json').read_text())
              by_name = {result['participant']: result for result in results}
              for name in ('baseline_random', 'rafael_flor'):
                  result = by_name[name]
                  assert result['success'], f'Known-good Lab {lab} agent {name} failed'
                  assert result['num_episodes'] == 30 and result['base_seed'] == 42
          assert Path('LEADERBOARD.md').is_file()
          PYCODE
      - name: Upload validated tournament preview
        if: steps.preview.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tournament-preview
          path: |
            ${{ runner.temp }}/tournament-preview/web/data/leaderboard_p1.json
            ${{ runner.temp }}/tournament-preview/web/data/leaderboard_p2.json
            ${{ runner.temp }}/tournament-preview/web/data/manifest.json
            ${{ runner.temp }}/tournament-preview/LEADERBOARD.md
          if-no-files-found: error
          retention-days: 7
      - name: Check Python syntax
        run: python -m compileall -q tournament tests
